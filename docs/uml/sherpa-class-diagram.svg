<text class="title" x="30" y="46">Sherpa - Sign-up Data Model</text><text class="sub" x="30" y="74">IMPLEMENTED SIGN-UP SCOPE: User, Profile, major and desired-career lookups. IDs are String UUIDs; role is stored as String.</text>
